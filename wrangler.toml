name = "idhs"
main = "dist/workers.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files (assets, favicon, llms.txt) served by the platform;
# dynamic routes fall through to the worker entry.
[assets]
directory = "./public"

[vars]
DISABLE_API_SEARCH = "false"

APP_URL = "https://idhs.marketingcursor.com"

SPOTIFY_API_URL = "https://api.spotify.com/v1"
SPOTIFY_BASE_URL = "https://open.spotify.com"

YOUTUBE_API_URL = "https://content-youtube.googleapis.com/youtube/v3"
YOUTUBE_MUSIC_BASE_URL = "https://music.youtube.com"

DEEZER_API_URL = "https://api.deezer.com/search"

APPLE_MUSIC_API_URL = "https://music.apple.com/ca"

SOUNDCLOUD_BASE_URL = "https://soundcloud.com"

QOBUZ_API_URL = "https://www.qobuz.com/api.json/0.2"
QOBUZ_APP_ID = ""
QOBUZ_STREAM_URL = "https://play.qobuz.com"
QOBUZ_STORE_URL = "https://www.qobuz.com/us-en"

BANDCAMP_API_URL = "https://bandcamp.com/api/bcsearch_public_api/1/autocomplete_elastic"
BANDCAMP_BASE_URL = "https://bandcamp.com/"

PANDORA_API_URL = "https://www.pandora.com/api/v3/sod/search"

JIOSAAVN_API_URL = "https://www.jiosaavn.com"

ITUNES_API_URL = "https://itunes.apple.com"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaDO"]

[[migrations]]
tag = "v2-remove-quota"
deleted_classes = ["QuotaDO"]

[observability.logs]
enabled = true
invocation_logs = true
